services:

  # ---------------------------------------------------------------------------
  # timescaledb — primary persistence store
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: kymo-timescaledb
    environment:
      POSTGRES_DB:       kymo
      POSTGRES_USER:     kymo
      POSTGRES_PASSWORD: kymo
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kymo -d kymo"]
      interval: 10s
      timeout:  5s
      retries:  5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # kymo — the KYMO service (API + web UI on :8080)
  # Schema migrations are applied automatically on startup.
  # ---------------------------------------------------------------------------
  kymo:
    build:
      context:    .
      dockerfile: Dockerfile
    container_name: kymo
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      KYMO_DATABASE_DSN:                  "postgres://kymo:kymo@timescaledb:5432/kymo?sslmode=disable"
      KYMO_SERVER_ADDRESS:                ":8080"
      KYMO_COLLECTOR_STATS_POLL_INTERVAL: "15s"
      KYMO_COLLECTOR_SCORING_INTERVAL:    "60s"
      KYMO_COLLECTOR_SCORING_WINDOW:      "24h"
      KYMO_LOG_LEVEL:                     "info"
      KYMO_LOG_FORMAT:                    "json"
      # Required to upload kubeconfigs from the Sources page; keep it stable,
      # stored kubeconfigs cannot be decrypted with a different key.
      KYMO_SECRET_KEY:                    "${KYMO_SECRET_KEY:-}"
      # With no sources configured KYMO starts empty. Kubernetes sources can be
      # added from the web UI (Sources page: paste a kubeconfig; this needs
      # KYMO_SECRET_KEY above), or declared in a config file: mount it at
      # /etc/kymo/config.yaml together with the kubeconfig it references
      # (see config.example.yaml), e.g. by uncommenting the volumes below.
    ports:
      - "8080:8080"
    # volumes:
    #   - ./config.yaml:/etc/kymo/config.yaml:ro
    #   - ./kubeconfig:/etc/kymo/kubeconfig:ro   # kubeconfig_path: /etc/kymo/kubeconfig
    restart: unless-stopped

volumes:
  timescaledb_data:
