name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (fmt, vet, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./migrations)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 ./...

  db:
    name: Database integration tests
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: kymo
          POSTGRES_PASSWORD: kymo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kymo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KYMO_TEST_DSN: postgres://kymo:kymo@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Repository integration tests
        run: go test -race -count=1 ./internal/repository/...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --configuration production

  image:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm chart (lint, template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint deploy/helm/kymo
      - name: Template (defaults)
        run: helm template kymo deploy/helm/kymo > /dev/null
      - name: Template (external database)
        run: |
          helm template kymo deploy/helm/kymo \
            --set timescaledb.enabled=false \
            --set database.dsn='postgres://kymo:pass@db.example.com:5432/kymo?sslmode=require' > /dev/null
      - name: Template (ingress)
        run: |
          helm template kymo deploy/helm/kymo \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set 'ingress.hosts[0].host=kymo.example.com' > /dev/null
      - name: Template fails without a database DSN
        run: |
          if helm template kymo deploy/helm/kymo --set timescaledb.enabled=false > /dev/null 2>&1; then
            echo "expected failure when no database is configured"; exit 1
          fi
