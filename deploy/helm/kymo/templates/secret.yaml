{{- /*
  One Secret for everything generated: KYMO_SECRET_KEY, the bundled database
  password, the DSN and the initial admin password. Generated values are looked up from the live Secret so
  they stay stable across `helm upgrade` (they are only random on first install).
*/ -}}
{{- $name := include "kymo.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $old := dict -}}
{{- if $existing }}{{- $old = $existing.data | default dict -}}{{- end -}}
{{- $data := dict -}}
{{- /* values already base64-encoded */ -}}
{{- if not .Values.secretKey.existingSecret -}}
  {{- $_ := set $data "secret-key" (ternary (.Values.secretKey.value | b64enc) (get $old "secret-key" | default (randAlphaNum 48 | b64enc)) (ne .Values.secretKey.value "")) -}}
{{- end -}}
{{- if .Values.timescaledb.enabled -}}
  {{- $pw := ternary (.Values.timescaledb.auth.password | b64enc) (get $old "postgres-password" | default (randAlphaNum 32 | b64enc)) (ne .Values.timescaledb.auth.password "") -}}
  {{- $_ := set $data "postgres-password" $pw -}}
  {{- $dsn := printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" (urlquery .Values.timescaledb.auth.username) ($pw | b64dec | urlquery) (include "kymo.timescaledb.fullname" .) (urlquery .Values.timescaledb.auth.database) -}}
  {{- $_ := set $data "database-dsn" ($dsn | b64enc) -}}
{{- else if not .Values.database.existingSecret -}}
  {{- $_ := set $data "database-dsn" (.Values.database.dsn | b64enc) -}}
{{- end -}}
{{- /* initial admin password: explicit value, else kept from the live Secret, else random */ -}}
{{- if and .Values.auth.enabled (not .Values.auth.admin.existingSecret) -}}
  {{- $_ := set $data "admin-password" (ternary (.Values.auth.admin.password | b64enc) (get $old "admin-password" | default (randAlphaNum 24 | b64enc)) (ne .Values.auth.admin.password "")) -}}
{{- end -}}
{{- if and .Values.auth.oidc.clientSecret (not .Values.auth.oidc.existingSecret) -}}
  {{- $_ := set $data "oidc-client-secret" (.Values.auth.oidc.clientSecret | b64enc) -}}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kymo.labels" . | nindent 4 }}
data:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v }}
  {{- end }}
{{- end }}
