<header class="bg-kymo-deep border-b border-kymo-rule">
  <div class="flex flex-wrap lg:flex-nowrap items-stretch min-h-12 px-3 sm:px-4 gap-x-4">
    <!-- Brand -->
    <a
      routerLink="/dashboard"
      class="flex items-center gap-2.5 flex-none h-12 text-kymo-ink hover:text-kymo-amber transition-colors"
      aria-label="KYMO — overview"
    >
      <app-logo [size]="22" />
      <span class="text-sm font-semibold tracking-[0.3em]">KYMO</span>
    </a>

    <!-- Tabs -->
    <nav
      class="order-last lg:order-none w-full lg:w-auto lg:flex-1 min-w-0 flex items-stretch overflow-x-auto scrollbar-none -mx-3 px-1 sm:-mx-4 sm:px-2 lg:mx-0 lg:px-0 border-t border-kymo-rule lg:border-t-0"
      aria-label="Main navigation"
    >
      @for (tab of tabs; track tab.path; let i = $index) {
        <a
          [routerLink]="tab.path"
          routerLinkActive="!text-kymo-amber !border-kymo-amber"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          [title]="tab.label + ' (' + (i + 1) + ')'"
          class="flex items-center px-3 h-10 lg:h-12 text-xs font-medium whitespace-nowrap text-kymo-muted hover:text-kymo-ink border-b-2 border-transparent transition-colors"
        >{{ tab.label }}</a>
      }
    </nav>

    <!-- Controls -->
    <div class="flex items-center gap-1.5 flex-none ml-auto lg:ml-0">
      <span class="hidden lg:inline text-[11px] text-kymo-faint tabular-nums mr-1" aria-live="off">{{ updatedLabel() }}</span>

      <button
        type="button"
        class="k-btn k-btn-icon"
        (click)="refresh()"
        title="Refresh now"
        aria-label="Refresh now"
      >
        <svg class="w-3.5 h-3.5" [class.animate-spin]="spinning()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="square" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>

      <button
        type="button"
        class="k-btn gap-1.5 px-2 tracking-[0.08em]"
        [class.text-kymo-amber]="refreshSvc.autoRefresh()"
        [class.text-kymo-faint]="!refreshSvc.autoRefresh()"
        (click)="refreshSvc.toggleAuto()"
        [attr.aria-pressed]="refreshSvc.autoRefresh()"
        aria-label="Auto-refresh"
        [title]="refreshSvc.autoRefresh() ? 'Auto-refresh on (every 30s) — click to pause' : 'Auto-refresh paused — click to resume'"
      >
        <span class="k-led" [class]="refreshSvc.autoRefresh() ? 'bg-kymo-amber animate-pulse' : 'bg-kymo-faint'"></span>
        REC
      </button>

      <!-- Source selector -->
      @if (sourceState.sources().length > 0) {
        <div class="relative" data-source-menu>
          <button
            type="button"
            class="k-btn gap-1.5 px-2"
            [class.!border-kymo-amber]="!!sourceState.selectedSource()"
            (click)="toggleSourceMenu()"
            aria-haspopup="listbox"
            [attr.aria-expanded]="showSourceMenu()"
            aria-label="Select source"
          >
            @if (selectedSource(); as s) {
              <span class="k-led" [class]="dotClass(s)" [title]="statusLabel(s)"></span>
            } @else {
              <span class="k-led bg-kymo-faint"></span>
            }
            <span class="truncate max-w-[120px]">{{ sourceState.selectedSource() || 'all sources' }}</span>
            <svg class="w-3 h-3 flex-none text-kymo-muted transition-transform" [class.rotate-180]="showSourceMenu()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path stroke-linecap="square" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          @if (showSourceMenu()) {
            <div class="absolute right-0 top-full mt-1 bg-kymo-deep border border-kymo-rule z-50 min-w-[240px] py-1" role="listbox" aria-label="Sources">
              <button
                type="button"
                role="option"
                [attr.aria-selected]="sourceState.selectedSource() === ''"
                class="w-full px-3 py-2 text-xs text-left hover:bg-kymo-raised transition-colors flex items-center gap-2"
                [class]="sourceState.selectedSource() === '' ? 'text-kymo-amber' : 'text-kymo-ink'"
                (click)="selectSource('')"
              >
                <span class="k-led bg-kymo-faint"></span>
                <span class="flex-1">all sources</span>
              </button>
              <div class="border-t border-kymo-rule my-1"></div>
              @for (src of sourceState.sources(); track src.name) {
                <button
                  type="button"
                  role="option"
                  [attr.aria-selected]="sourceState.selectedSource() === src.name"
                  class="w-full px-3 py-2 text-xs text-left hover:bg-kymo-raised transition-colors flex items-center gap-2"
                  [class]="sourceState.selectedSource() === src.name ? 'text-kymo-amber' : 'text-kymo-ink'"
                  [title]="statusLabel(src)"
                  (click)="selectSource(src.name)"
                >
                  <span class="k-led" [class]="dotClass(src)"></span>
                  <span class="truncate flex-1">{{ src.name }}</span>
                  <span class="k-label !text-[10px] flex-none">{{ src.type === 'kubernetes' ? 'k8s' : 'docker' }}</span>
                </button>
              }
            </div>
          }
        </div>
      }

      <button
        type="button"
        class="k-btn gap-1.5 px-2"
        (click)="openPalette()"
        aria-label="Search (command palette)"
        [title]="'Search — ' + (isMac ? '⌘K' : 'Ctrl+K')"
      >
        <svg class="w-3.5 h-3.5 text-kymo-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="square" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z" />
        </svg>
        <span class="hidden md:inline text-kymo-muted">{{ isMac ? '⌘K' : 'Ctrl K' }}</span>
      </button>
    </div>
  </div>
</header>

@if (paletteOpen()) {
  <app-command-palette [tabs]="palettePages" (closed)="paletteOpen.set(false)" />
}
