# KYMO configuration — copy to config.yaml and adjust.
# Every key can also be set via environment variables prefixed with KYMO_
# (nested keys joined by "_"), e.g. KYMO_DATABASE_DSN, KYMO_SERVER_ADDRESS.
# config.yaml is read from the working directory or /etc/kymo/.
#
# Live reload: edits to collector.sources are applied automatically while KYMO
# runs (or via the "Reload config.yaml" button / POST /api/v1/sources/reload).
# An invalid file is rejected and the current sources keep running. Every other
# setting (server, auth, database, log, secret_key, poll/scoring intervals)
# needs a restart.

server:
  address: ":8080"
  read_timeout: "15s"
  # Directory with the built web UI (frontend/dist/frontend/browser).
  # Leave empty to serve the API only (use `make web-dev` during development).
  static_dir: ""
  # Externally reachable URL of the web UI, e.g. "https://kymo.example.com".
  # Notifications use it for the "Open in KYMO" link
  # (<public_url>/workloads/<workload id>). Leave empty for no links.
  public_url: ""
  # Extra browser origins allowed to call the API with credentials (CORS) and
  # to pass the CSRF origin check, e.g. a separately hosted dashboard. Empty =
  # same-origin only (the default; CORS "*" no longer exists).
  allowed_origins: []
  #  - "https://dashboard.example.com"
  # Proxies (IPs / CIDRs) whose X-Forwarded-For header is trusted for the client
  # IP used by the login rate limit and the audit log. Empty = Gin default
  # (trust every proxy, so the header can be spoofed). Behind an ingress set it,
  # e.g. ["10.0.0.0/8"].
  trusted_proxies: []

# Accounts & access control. Roles: viewer < operator < admin < owner.
# Sign-in is by username (or email, optional). With no users yet KYMO creates
# the initial owner at startup: from KYMO_ADMIN_USERNAME (default "admin") +
# KYMO_ADMIN_PASSWORD (+ KYMO_ADMIN_EMAIL, KYMO_ADMIN_NAME,
# KYMO_ADMIN_MUST_CHANGE_PASSWORD=true), or - when no password is set - as
# "admin" with a random password that must be changed at first sign-in and is
# logged once ("initial admin account created: ..."). Ignored once users exist.
# Lockout recovery:
#   kymo admin reset-password --username admin
auth:
  # false = NO authentication, every request acts as the owner. Local
  # development only; KYMO logs a loud warning.
  enabled: true
  session_idle_timeout: "168h"   # sliding lifetime (7 days)
  session_max_age: "720h"        # absolute lifetime (30 days)
  # Single sign-on (OpenID Connect). Redirect URL to register at the provider:
  #   <server.public_url>/api/v1/auth/oidc/callback   (public_url is required)
  # The ID token must carry a verified email (and the groups claim if used).
  oidc:
    enabled: false
    name: "Google"                       # sign-in button label
    issuer: "https://accounts.google.com"
    client_id: ""
    client_secret: ""                    # or KYMO_AUTH_OIDC_CLIENT_SECRET
    scopes: ["openid", "email", "profile"]
    allowed_domains: []                  # e.g. ["example.com"]; checked on the verified email
    groups_claim: ""                     # e.g. "groups" or "realm_access.roles"
    role_mapping: {}                     # highest matching role wins, re-synced at every login
    #  admin: ["kymo-admins"]
    #  operator: ["sre"]
    default_role: "viewer"               # new users without a mapped group
    auto_create: true                    # false = users need an invite first
    disable_password_login: false        # true = SSO only (local login is refused)

database:
  dsn: "postgres://kymo:kymo@localhost:5432/kymo?sslmode=disable"
  max_conns: 20
  # Apply the embedded SQL migrations on startup.
  auto_migrate: true

# Encrypts kubeconfigs uploaded through the UI (AES-256-GCM). Without it,
# Kubernetes sources added in the UI can only reference kubeconfig files on
# the server. Prefer setting it via the KYMO_SECRET_KEY environment variable.
# secret_key: "change-me"

collector:
  stats_poll_interval: "15s"   # default resource sampling interval
  scoring_interval: "60s"      # how often stability scores are recomputed
  scoring_window: "24h"        # look-back window for scoring
  # Crash-time log snapshots: when a container crashes or is OOM-killed, KYMO
  # stores the tail of its logs so the UI can show what it printed before it
  # died. NOTE: logs can contain sensitive data (tokens, PII); set
  # enabled: false if that is a concern. Snapshots are kept for 30 days.
  crash_logs:
    enabled: true
    tail_lines: 200            # max 2000
    max_bytes: 65536           # max 1048576 (1 MiB)
  # Kubernetes Events expire in the cluster after ~1h; KYMO keeps them for 90
  # days. Warning events are always kept; Normal events only for the listed
  # reasons. Needs list/watch on "events" (cluster-wide) in the source's RBAC.
  k8s_events:
    enabled: true
    normal_reasons:
      - ScalingReplicaSet
      - SuccessfulCreate
      - SuccessfulDelete
      - Killing
      - SawCompletedJob
      - SuccessfulRescale
      - Preempted
      - Rebooted
      - NodeNotReady
      - RegisteredNode
      - RemovingNode
      - Evicted
    exclude_namespaces: []     # e.g. [kube-system]
  # Sources declared here are locked in the UI and reloaded live when this file
  # changes (added, changed and removed sources are applied without a restart).
  # Sources can also be added, edited and removed at runtime from the Sources
  # page (stored in the database); a name used here must not clash with them.
  # With no sources configured KYMO starts empty; add Kubernetes sources from
  # the Sources page instead (paste a kubeconfig; needs KYMO_SECRET_KEY).
  # Only "kubernetes" sources are supported for now.
  sources: []
  # sources:
  #   - name: "dev-cluster"
  #     type: "kubernetes"
  #     kubeconfig_path: "/path/to/kubeconfig"   # placeholder; default: in-cluster, then ~/.kube/config
  #     kube_context: "dev"                      # default: current-context
  #     poll_interval: "30s"                     # needs metrics-server for CPU/memory
  #     read_only: true                          # recommended for production clusters

# Server-side issues: KYMO evaluates every workload of the registered clusters
# and keeps a persistent list of problems (crash loops, OOM kills, degraded
# workloads, failed CronJobs, scheduling / image pull / volume / probe problems
# from Kubernetes Warning events). Resolved issues are kept for 90 days.
issues:
  evaluate_interval: "30s"   # how often all workloads are evaluated
  degraded_after: "3m"       # "Degraded" opens after this long partially ready
  resolve_after: "5m"        # a problem must be gone this long before it resolves
  reopen_window: "15m"       # returning within this window reopens the same issue (flap)
  include_system: false      # also evaluate kube-system & co.
  error_rate_threshold: 20   # "Error logs" issue: captured error lines in 5 minutes (needs log_capture)

# Opt-in error-log capture. For workloads you opt in (UI toggle, pod annotation
# kymo.io/capture-error-logs: "true", or the targets below) KYMO follows the
# logs of their RUNNING containers, keeps only error lines (with stack traces),
# groups them into signatures and stores counts + a few masked samples.
# Nothing is captured unless a workload / namespace is opted in. NOTE: logs can
# contain sensitive data; masking (tokens, passwords, keys, JWTs, card numbers)
# is best-effort. Needs "get" on pods/log in the source's RBAC. Targets,
# patterns and limits apply live when this file changes; retention needs a restart.
log_capture:
  enabled: true                # global kill switch: false = nothing streams
  max_streams_per_source: 50   # concurrently followed containers per source (oldest first)
  max_lines_per_minute: 600    # per container; excess error entries are dropped and counted
  samples_per_signature: 50    # newest masked occurrences kept per signature
  retention: "7d"              # occurrences and counts ("7d", "48h"); applied at startup
  extra_patterns: []           # extra regexes that mark a line as an error, e.g. ["connection reset"]
  ignore_patterns: []          # regexes that discard a line, e.g. ["healthz", "(?i)deprecat"]
  targets: []                  # opt-ins declared here are read-only in the UI
  # targets:
  #   - source: "dev-cluster"
  #     namespace: "shop"
  #     workload: "Deployment/worker"   # optional (Kind/name); omitted = whole namespace

# Notifications (Slack, Discord, generic webhook). Channels are usually added in
# the UI (Settings), which stores their URL encrypted and therefore needs
# KYMO_SECRET_KEY. Channels declared here need no key but are locked in the UI,
# are reloaded live with this file, and keep the URL IN PLAIN TEXT in the file:
# keep config.yaml private (or inject it from a secret). Edits to the channel
# list apply without a restart; "enabled" below needs a restart.
notifications:
  enabled: true
  channels: []
  # channels:
  #   - name: "ops-slack"
  #     type: "slack"                     # slack | discord | webhook
  #     url: "https://hooks.slack.com/services/T000/B000/XXXX"   # placeholder
  #     enabled: true
  #     min_severity: "critical"          # critical | warning (default critical)
  #     sources: []                       # empty = all clusters
  #     namespaces: []                    # empty = all namespaces
  #     types: []                         # empty = all; crash_loop, oom, degraded, job_failed,
  #                                       # cant_schedule, image_pull, evicted, volume_mount, probe_failing,
  #                                       # error_rate
  #     notify_resolved: true
  #     include_logs: true                # attach the newest crash log (last 20 lines)
  #     repeat_minutes: 0                 # re-send open issues every N minutes (0 = never)
  #   - name: "billing-webhook"
  #     type: "webhook"
  #     url: "https://example.com/kymo-hook"
  #     secret: "hmac-secret"             # signs the body: X-KYMO-Signature: sha256=<hex>

log:
  level: "info"      # debug | info | warn | error
  format: "console"  # console | json
