# KYMO configuration — copy to config.yaml and adjust.
# Every key can also be set via environment variables prefixed with KYMO_
# (nested keys joined by "_"), e.g. KYMO_DATABASE_DSN, KYMO_SERVER_ADDRESS.
# config.yaml is read from the working directory or /etc/kymo/.
#
# Live reload: edits to collector.sources are applied automatically while KYMO
# runs (or via the "Reload config.yaml" button / POST /api/v1/sources/reload).
# An invalid file is rejected and the current sources keep running. Every other
# setting (server, database, log, secret_key, poll/scoring intervals) needs a
# restart.

server:
  address: ":8080"
  read_timeout: "15s"
  # Directory with the built web UI (frontend/dist/frontend/browser).
  # Leave empty to serve the API only (use `make web-dev` during development).
  static_dir: ""

database:
  dsn: "postgres://kymo:kymo@localhost:5432/kymo?sslmode=disable"
  max_conns: 20
  # Apply the embedded SQL migrations on startup.
  auto_migrate: true

# Encrypts kubeconfigs uploaded through the UI (AES-256-GCM). Without it,
# Kubernetes sources added in the UI can only reference kubeconfig files on
# the server. Prefer setting it via the KYMO_SECRET_KEY environment variable.
# secret_key: "change-me"

collector:
  stats_poll_interval: "15s"   # default resource sampling interval
  scoring_interval: "60s"      # how often stability scores are recomputed
  scoring_window: "24h"        # look-back window for scoring
  # Sources declared here are locked in the UI and reloaded live when this file
  # changes (added, changed and removed sources are applied without a restart).
  # Sources can also be added, edited and removed at runtime from the Sources
  # page (stored in the database); a name used here must not clash with them.
  sources:
    - name: "local-docker"
      type: "docker"
      # read_only: true                          # hide/forbid start, stop, kill, …
      # socket: "unix:///var/run/docker.sock"   # default: DOCKER_HOST
    # - name: "dev-cluster"
    #   type: "kubernetes"
    #   kubeconfig_path: "/path/to/kubeconfig"
    #   kube_context: "dev"                      # default: current-context
    #   poll_interval: "30s"                     # needs metrics-server for CPU/memory
    #   read_only: true                          # recommended for production clusters

log:
  level: "info"      # debug | info | warn | error
  format: "console"  # console | json
